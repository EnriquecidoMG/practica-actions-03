name: Pruebas Node.js

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

      - name: Usar secreto sin exponerlo
        env:
          MI_SECRETO: ${{ secrets.SALUDO_SECRETO }}
        run: |
          echo "El secreto tiene $(printf '%s' "$MI_SECRETO" | wc -c) caracteres"

      - name: Avisar de fallo
        if: failure()
        run: echo "Algún step anterior ha fallado"

      - name: Limpieza final
        if: always()
        run: echo "Esto se ejecuta pase lo que pase"

  solo-en-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Mensaje exclusivo de main
        run: echo "Esto solo se ve en main"
